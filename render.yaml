services:
  - type: web
    name: herbario-surco
    runtime: node
    plan: starter
    buildCommand: echo "sin dependencias"
    startCommand: node server/index.js
    healthCheckPath: /
    disk:
      name: datos
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: HOST
        value: 0.0.0.0
      - key: HERBARIO_SECURE
        value: "1"
      - key: HERBARIO_DATA
        value: /var/data
      - key: PUBLIC_URL
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
