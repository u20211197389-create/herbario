name = "herbario-surco"
main = "worker/index.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Estas rutas pasan primero por el Worker; el resto se sirve como archivos estáticos.
run_worker_first = ["/api/*", "/uploads/*", "/assets/js/data.js"]

[[d1_databases]]
binding = "DB"
database_name = "herbario"
database_id = "c829223e-0760-4e59-912d-28ea9cc241ff"
