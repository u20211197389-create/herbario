<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Administración · Herbario SURCO</title>
  <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg?v=16">
  <link rel="stylesheet" href="admin.css?v=16">
  <script src="admin.js?v=16" defer></script>
</head>
<body>
  <main id="login-view" class="login" hidden>
    <form id="login-form" class="login-card" autocomplete="on">
      <h1>Herbario SURCO</h1>
      <p>Acceso de administradores</p>
      <label>Correo<input id="login-user" name="username" autocomplete="username" required maxlength="60"></label>
      <label>Contraseña<input id="login-pass" name="password" type="password" autocomplete="current-password" required maxlength="200"></label>
      <p id="login-error" class="error" role="alert"></p>
      <button class="btn" type="submit">Entrar</button>
      <a class="back" href="/">← Volver al sitio</a>
    </form>
  </main>

  <div id="app-view" hidden>
    <header class="bar">
      <strong>Administración · Herbario SURCO</strong>
      <span class="spacer"></span>
      <div class="usermenu">
        <button id="user-btn" class="user-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Menú de usuario">
          <span id="avatar" class="avatar">A</span>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div id="user-pop" class="user-pop" hidden>
          <div class="user-head"><span class="avatar big" id="avatar2">A</span><div><strong id="who"></strong><small>Administrador</small></div></div>
          <a href="/" target="_blank" rel="noopener">Ver sitio</a>
          <button id="menu-profile" type="button">Editar perfil</button>
          <button id="menu-pass" type="button">Cambiar contraseña</button>
          <button id="logout" type="button" class="danger">Cerrar sesión</button>
        </div>
      </div>
    </header>
    <nav id="tabs" class="tabs" aria-label="Secciones"></nav>
    <section id="panel" class="panel"></section>
  </div>

  <dialog id="editor"><form method="dialog" id="editor-form"></form></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
